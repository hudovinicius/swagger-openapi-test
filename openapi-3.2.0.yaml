openapi: "3.2.0"
$self: "#"
info:
  title: Manual import matrix - OpenAPI 3.2.0
  version: 1.0.0
  description: Controlled fixture restricted to features safely lowered by the 3.2 adapter.
servers:
  - url: https://manual.example.test/api
security:
  - ApiKeyAuth: []
paths:
  /manual/items/{id}:
    post:
      tags: [manual-openapi-32]
      operationId: createManualItem
      summary: Exercise the supported OpenAPI 3.2 adapter surface
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
        - name: labels
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - $ref: "#/components/parameters/CorrelationId"
        - name: session
          in: cookie
          schema:
            type: [string, "null"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                note:
                  type: string
                file:
                  type: string
                  format: binary
          application/octet-stream: {}
      responses:
        "201":
          description: Created item
          headers:
            X-Rate-Limit:
              description: Remaining requests
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "206":
          description: Sequential item stream adapted from itemSchema
          content:
            application/x-ndjson:
              itemSchema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Invalid payload
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        default: controlled-test
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
  schemas:
    BaseItem:
      type: object
      required: [name, status]
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          minLength: 2
          maxLength: 80
        nickname:
          type: [string, "null"]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        price:
          type: number
          minimum: 0
        createdAt:
          type: string
          format: date-time
          readOnly: true
    Item:
      allOf:
        - $ref: "#/components/schemas/BaseItem"
        - type: object
          properties:
            tags:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
            metadata:
              type: object
              additionalProperties:
                type: string
            secret:
              type: string
              writeOnly: true
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

