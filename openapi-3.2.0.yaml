---
openapi: 3.2.0
info:
  title: Storefront Import Test API - OpenAPI 3.2.0
  summary: Complete and coherent contract used to test OpenAPI imports
  description: |
    A fictional storefront API covering catalog browsing, product maintenance,
    binary images, order creation and operational health checks.
  termsOfService: https://storefront.example.test/terms
  contact:
    name: Storefront API Team
    email: api@example.test
    url: https://storefront.example.test/support
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  version: 1.0.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
- url: https://{environment}.storefront.example.test/{basePath}
  description: Storefront environment
  variables:
    environment:
      default: sandbox
      enum:
      - sandbox
      - production
    basePath:
      default: api/v1
tags:
- name: Storefront
  summary: Storefront API
  description: Root navigation group for the sample API.
  kind: nav
- name: Products
  description: Product catalog and maintenance
  summary: Product catalog and maintenance
  parent: Storefront
  kind: nav
- name: Orders
  description: Customer order lifecycle
  summary: Customer order lifecycle
  parent: Storefront
  kind: nav
- name: Operations
  description: Operational endpoints
  summary: Operational endpoints
  parent: Storefront
  kind: nav
externalDocs:
  description: Integration guide
  url: https://storefront.example.test/docs
security:
- ApiKeyHeader: []
paths:
  "/products":
    get:
      tags:
      - Products
      operationId: listProducts
      summary: List catalog products
      description: Returns a paginated product collection with optional structured filters.
      parameters:
      - "$ref": "#/components/parameters/CorrelationId"
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PageSize"
      - name: sort
        in: query
        description: Ordered fields; prefix a field with `-` for descending order.
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - name
            - "-name"
            - price
            - "-price"
      - name: filter
        in: query
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductFilter"
      security:
      - ApiKeyHeader: []
      - OAuth2:
        - products:read
      responses:
        '200':
          "$ref": "#/components/responses/ProductPageResponse"
        '304':
          description: Catalog has not changed
        default:
          "$ref": "#/components/responses/ProblemResponse"
    post:
      tags:
      - Products
      operationId: createProduct
      summary: Create a product
      deprecated: false
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        "$ref": "#/components/requestBodies/ProductInputBody"
      callbacks:
        priceChanged:
          "{$request.body#/callbacks/priceChanged}":
            post:
              operationId: notifyPriceChanged
              summary: Receive a product price change
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      "$ref": "#/components/schemas/PriceChangedEvent"
              responses:
                '204':
                  description: Event accepted
      security:
      - OAuth2:
        - products:write
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Product"
              examples:
                standard:
                  "$ref": "#/components/examples/StandardProduct"
          links:
            GetCreatedProduct:
              operationId: getProduct
              parameters:
                productId: "$response.body#/id"
        '409':
          "$ref": "#/components/responses/ProblemResponse"
  "/products/{productId}":
    parameters:
    - "$ref": "#/components/parameters/ProductId"
    get:
      tags:
      - Products
      operationId: getProduct
      summary: Get a product
      parameters:
      - name: X-Locale
        in: header
        description: Requested localization for product text
        schema:
          type: string
          default: pt-BR
      - name: storefront_session
        in: cookie
        schema:
          type: string
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      responses:
        '200':
          description: Product found
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Product"
              examples:
                standard:
                  "$ref": "#/components/examples/StandardProduct"
            application/xml:
              schema:
                "$ref": "#/components/schemas/Product"
        '404':
          "$ref": "#/components/responses/ProblemResponse"
    put:
      tags:
      - Products
      operationId: replaceProduct
      summary: Replace a product
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        "$ref": "#/components/requestBodies/ProductInputBody"
      security:
      - OAuth2:
        - products:write
      responses:
        '200':
          description: Product replaced
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Product"
        '412':
          "$ref": "#/components/responses/ProblemResponse"
    patch:
      tags:
      - Products
      operationId: patchProduct
      summary: Partially update a product
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              "$ref": "#/components/schemas/ProductPatch"
      security:
      - OAuth2:
        - products:write
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Product"
        '422':
          "$ref": "#/components/responses/ProblemResponse"
    delete:
      tags:
      - Products
      operationId: deleteProduct
      summary: Delete a product
      security:
      - OAuth2:
        - products:write
        ApiKeyHeader: []
      responses:
        '204':
          description: Product deleted
        '404':
          "$ref": "#/components/responses/ProblemResponse"
    head:
      tags:
      - Products
      operationId: headProduct
      summary: Read product metadata
      security:
      - ApiKeyQuery: []
      responses:
        2XX:
          description: Product metadata
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            X-Product-Version:
              schema:
                type: integer
                format: int64
    options:
      tags:
      - Products
      operationId: productOptions
      summary: Discover product capabilities
      security: []
      responses:
        default:
          description: Supported methods and features
          content:
            application/json:
              schema: true
  "/products/{productId}/image":
    parameters:
    - "$ref": "#/components/parameters/ProductId"
    get:
      tags:
      - Products
      operationId: getProductImage
      summary: Download the product image
      security:
      - ApiKeyCookie: []
      responses:
        '200':
          description: Raw product image
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            image/png:
              schema: {}
            image/jpeg:
              schema: {}
        '404':
          "$ref": "#/components/responses/ProblemResponse"
    put:
      tags:
      - Products
      operationId: uploadProductImage
      summary: Upload the product image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  contentMediaType: image/png
                altText:
                  type:
                  - string
                  - 'null'
                  maxLength: 120
            encoding:
              file:
                contentType: image/png, image/jpeg
                headers:
                  X-Checksum-SHA256:
                    schema:
                      type: string
                      pattern: "^[a-f0-9]{64}$"
      security:
      - OAuth2:
        - products:write
      responses:
        '204':
          description: Image stored
        '413':
          "$ref": "#/components/responses/ProblemResponse"
  "/orders":
    post:
      tags:
      - Orders
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrderInput"
          application/x-www-form-urlencoded:
            schema:
              "$ref": "#/components/schemas/OrderForm"
            encoding:
              productIds:
                style: form
                explode: true
      security:
      - ApiKeyHeader: []
        OAuth2:
        - orders:write
      responses:
        '202':
          description: Order accepted for processing
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Order"
        '400':
          "$ref": "#/components/responses/ProblemResponse"
  "/orders/{orderId}":
    get:
      tags:
      - Orders
      operationId: getOrder
      summary: Get an order
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth: []
      - OpenId:
        - openid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Order"
        '404':
          "$ref": "#/components/responses/ProblemResponse"
  "/health":
    get:
      tags:
      - Operations
      operationId: getHealth
      summary: Read service health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                const: ok
            application/health+json:
              schema:
                type: object
                additionalProperties: true
        '503':
          "$ref": "#/components/responses/ProblemResponse"
      parameters:
      - name: rawFilter
        in: querystring
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
  /data-types:
    post:
      tags: [Operations]
      operationId: echoDataTypes
      summary: Echo every supported schema data type
      description: Accepts and returns one example of every OpenAPI and JSON Schema data type and common format.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllDataTypes'
      responses:
        '200':
          description: Every submitted value echoed back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllDataTypes'
        '400':
          $ref: '#/components/responses/ProblemResponse'
webhooks:
  orderStatusChanged:
    post:
      tags:
      - Orders
      operationId: orderStatusChangedWebhook
      summary: Receive an order status change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrderStatusEvent"
      responses:
        '204':
          description: Webhook accepted
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: End-to-end request correlation identifier
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
  headers:
    ETag:
      description: Current resource entity tag
      required: true
      schema:
        type: string
  requestBodies:
    ProductInputBody:
      description: Complete writable product representation
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ProductInput"
          examples:
            standard:
              value:
                type: physical
                name: Mechanical Keyboard
                sku: KEY-001
                price: 499.9
                stock: 25
  responses:
    ProductPageResponse:
      description: Paginated products
      headers:
        X-Total-Count:
          description: Total matching products
          schema:
            type: integer
            format: int64
        Link:
          description: RFC 8288 pagination links
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ProductPage"
        application/json-seq:
          itemSchema:
            "$ref": "#/components/schemas/Product"
    ProblemResponse:
      description: Request could not be processed
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
  examples:
    StandardProduct:
      summary: Physical product example
      value:
        id: 9a25cfe8-83ee-4f5c-a5ad-fd49f122a1aa
        type: physical
        name: Mechanical Keyboard
        sku: KEY-001
        price: 499.9
        stock: 25
        tags:
        - peripherals
        - keyboard
        createdAt: '2026-01-15T10:30:00Z'
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
    ApiKeyCookie:
      type: apiKey
      in: cookie
      name: storefront_session
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.test/oauth/authorize
          tokenUrl: https://identity.example.test/oauth/token
          refreshUrl: https://identity.example.test/oauth/refresh
          scopes:
            products:read: Read the product catalog
            products:write: Maintain products
            orders:write: Create orders
    OpenId:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.test/.well-known/openid-configuration
  schemas:
    AllDataTypes:
      type: object
      required:
        - stringValue
        - byteValue
        - binaryValue
        - dateValue
        - dateTimeValue
        - passwordValue
        - emailValue
        - uuidValue
        - uriValue
        - integerValue
        - int32Value
        - int64Value
        - numberValue
        - floatValue
        - doubleValue
        - booleanValue
        - arrayValue
        - integerArrayValue
        - numberArrayValue
        - booleanArrayValue
        - objectArrayValue
        - nestedArrayValue
        - objectValue
        - nullValue
      properties:
        stringValue:
          type: string
          example: Storefront
        byteValue:
          type: string
          format: byte
          example: U3RvcmVmcm9udA==
        binaryValue:
          type: string
          format: binary
          example: raw-binary-content
        dateValue:
          type: string
          format: date
          example: '2026-08-05'
        dateTimeValue:
          type: string
          format: date-time
          example: '2026-08-05T12:30:00Z'
        passwordValue:
          type: string
          format: password
          example: secret-value
        emailValue:
          type: string
          format: email
          example: customer@example.test
        uuidValue:
          type: string
          format: uuid
          example: 9a25cfe8-83ee-4f5c-a5ad-fd49f122a1aa
        uriValue:
          type: string
          format: uri
          example: https://storefront.example.test/products/1
        integerValue:
          type: integer
          example: 10
        int32Value:
          type: integer
          format: int32
          example: 2147483647
        int64Value:
          type: integer
          format: int64
          example: 9007199254740991
        numberValue:
          type: number
          example: 10.25
        floatValue:
          type: number
          format: float
          example: 3.14
        doubleValue:
          type: number
          format: double
          example: 2.718281828
        booleanValue:
          type: boolean
          example: true
        arrayValue:
          type: array
          items:
            type: string
          example: [alpha, beta]
        integerArrayValue:
          type: array
          items:
            type: integer
            format: int32
          example: [1, 2, 3]
        numberArrayValue:
          type: array
          items:
            type: number
            format: double
          example: [1.5, 2.75, 10.25]
        booleanArrayValue:
          type: array
          items:
            type: boolean
          example: [true, false]
        objectArrayValue:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: integer
              name:
                type: string
          example:
            - id: 1
              name: first
            - id: 2
              name: second
        nestedArrayValue:
          type: array
          items:
            type: array
            items:
              type: integer
          example:
            - [1, 2]
            - [3, 4]
        objectValue:
          type: object
          additionalProperties:
            type: string
          example:
            environment: sandbox
        nullValue:
          type: 'null'
          example: null
    Money:
      type: number
      format: double
      minimum: 0
      maximum: 9999999.99
      multipleOf: 0.01
    ProductBase:
      type: object
      required:
      - type
      - name
      - sku
      - price
      properties:
        type:
          type: string
          enum:
          - physical
          - digital
        name:
          type: string
          minLength: 2
          maxLength: 120
          pattern: "^[^<>]+$"
        sku:
          type: string
          pattern: "^[A-Z0-9-]{3,32}$"
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        price:
          "$ref": "#/components/schemas/Money"
        tags:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        dimensions:
          type: array
          minItems: 3
          maxItems: 3
          prefixItems:
          - type: number
          - type: number
          - type: number
          items: {}
    ProductInput:
      allOf:
      - "$ref": "#/components/schemas/ProductBase"
      - oneOf:
        - "$ref": "#/components/schemas/PhysicalProductInput"
        - "$ref": "#/components/schemas/DigitalProductInput"
      discriminator:
        propertyName: type
        mapping:
          physical: "#/components/schemas/PhysicalProductInput"
          digital: "#/components/schemas/DigitalProductInput"
    PhysicalProductInput:
      type: object
      required:
      - stock
      - weightGrams
      properties:
        type:
          const: physical
        stock:
          type: integer
          format: int32
          minimum: 0
        weightGrams:
          type: integer
          minimum: 1
    DigitalProductInput:
      type: object
      required:
      - downloadUrl
      properties:
        type:
          const: digital
        downloadUrl:
          type: string
          format: uri
        checksum:
          type: string
          pattern: "^[a-f0-9]{64}$"
    Product:
      allOf:
      - "$ref": "#/components/schemas/ProductInput"
      - type: object
        required:
        - id
        - createdAt
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          createdAt:
            type: string
            format: date-time
            readOnly: true
          updatedAt:
            type:
            - string
            - 'null'
            format: date-time
            readOnly: true
          internalCost:
            allOf:
            - "$ref": "#/components/schemas/Money"
            writeOnly: true
    ProductPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
        description:
          type:
          - string
          - 'null'
        price:
          "$ref": "#/components/schemas/Money"
        stock:
          type: integer
          minimum: 0
      dependentRequired:
        stock:
        - type
      if:
        required:
        - type
        properties:
          type:
            const: digital
      then:
        not:
          required:
          - stock
    ProductFilter:
      type: object
      properties:
        minPrice:
          "$ref": "#/components/schemas/Money"
        maxPrice:
          "$ref": "#/components/schemas/Money"
        tags:
          type: array
          items:
            type: string
      anyOf:
      - required:
        - minPrice
      - required:
        - maxPrice
      - required:
        - tags
    ProductPage:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Product"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    OrderLineInput:
      type: object
      required:
      - productId
      - quantity
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 999
    OrderInput:
      type: object
      required:
      - customerEmail
      - lines
      properties:
        customerEmail:
          type: string
          format: email
        lines:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/OrderLineInput"
        notes:
          type:
          - string
          - 'null'
        metadata:
          type: object
          additionalProperties: true
    OrderForm:
      type: object
      required:
      - customerEmail
      - productIds
      properties:
        customerEmail:
          type: string
          format: email
        productIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    Order:
      allOf:
      - "$ref": "#/components/schemas/OrderInput"
      - type: object
        required:
        - id
        - status
        - total
        - createdAt
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          status:
            type: string
            enum:
            - pending
            - paid
            - shipped
            - cancelled
            readOnly: true
          total:
            allOf:
            - "$ref": "#/components/schemas/Money"
            readOnly: true
          createdAt:
            type: string
            format: date-time
            readOnly: true
    PriceChangedEvent:
      type: object
      required:
      - productId
      - oldPrice
      - newPrice
      - occurredAt
      properties:
        productId:
          type: string
          format: uuid
        oldPrice:
          "$ref": "#/components/schemas/Money"
        newPrice:
          "$ref": "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
    OrderStatusEvent:
      type: object
      required:
      - orderId
      - previousStatus
      - status
      - occurredAt
      properties:
        orderId:
          type: string
          format: uuid
        previousStatus:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - pending
          - paid
          - shipped
          - cancelled
        occurredAt:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        violations:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
"$self": https://storefront.example.test/specs/openapi-3.2.0.yaml
