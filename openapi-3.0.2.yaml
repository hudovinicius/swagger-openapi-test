openapi: "3.0.2"
info:
  title: Manual import matrix - OpenAPI 3.0.2
  version: 1.0.0
  description: Controlled fixture shared by the supported OpenAPI 3.0 patch releases.
servers:
  - url: https://manual.example.test/api
security:
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /manual/items/{id}:
    post:
      tags: [manual-openapi-30]
      operationId: createManualItem
      summary: Exercise the supported OpenAPI 3.0 import surface
      deprecated: true
      parameters:
        - name: id
          in: path
          description: Item identifier
          required: true
          style: simple
          explode: false
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
        - name: labels
          in: query
          style: form
          explode: false
          allowReserved: true
          schema:
            type: array
            default: [manual]
            items:
              type: string
              enum: [manual, regression, smoke]
        - name: filter
          in: query
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        - $ref: "#/components/parameters/CorrelationId"
        - name: session
          in: cookie
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Item"
            encoding:
              tags:
                style: pipeDelimited
                explode: false
                allowReserved: true
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                note:
                  type: string
                  maxLength: 120
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
                headers:
                  X-Checksum:
                    schema:
                      type: string
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "201":
          description: Created item
          headers:
            X-Rate-Limit:
              description: Remaining requests
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
            application/xml:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Invalid payload
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Unexpected error
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      deprecated: true
      schema:
        type: string
        default: controlled-test
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BaseItem:
      type: object
      required: [name, status]
      discriminator:
        propertyName: kind
        mapping:
          standard: "#/components/schemas/Item"
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^[A-Za-z0-9 _-]+$'
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        price:
          type: number
          format: double
          minimum: 0
          maximum: 999999
        createdAt:
          type: string
          format: date-time
          readOnly: true
    Item:
      allOf:
        - $ref: "#/components/schemas/BaseItem"
        - type: object
          properties:
            tags:
              type: array
              minItems: 1
              maxItems: 10
              uniqueItems: true
              items:
                type: string
            metadata:
              type: object
              additionalProperties:
                type: string
            secret:
              type: string
              format: password
              writeOnly: true
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

