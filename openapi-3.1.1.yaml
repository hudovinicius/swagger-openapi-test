openapi: "3.1.1"
info:
  title: Manual import matrix - OpenAPI 3.1.1
  version: 3.1.1
  description: Same endpoint and methods used by every supported specification version.
servers:
  - url: https://manual.example.test/api
security:
  - ApiKeyHeader: []
paths:
  /manual/items/{id}:
    parameters:
      - name: id
        in: path
        description: Item identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
          pattern: '^[a-z0-9-]+$'
      - name: locale
        in: query
        schema:
          type: string
          default: en-US
          enum: [en-US, pt-BR]
      - $ref: "#/components/parameters/CorrelationId"
      - name: session
        in: cookie
        schema:
          type: string
    get:
      tags: [manual-matrix]
      operationId: getManualItem
      summary: Root array response, parameters, response header and security OR
      parameters:
        - name: labels
          in: query
          style: form
          explode: false
          allowReserved: true
          schema:
            type: array
            items:
              type: string
              enum: [manual, regression, smoke]
        - name: filter
          in: query
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
      responses:
        "200":
          description: Matching items
          headers:
            X-Rate-Limit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/vnd.totvs.item+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "400":
          description: Invalid query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [manual-matrix]
      operationId: createManualItem
      summary: JSON object, parameter override and security AND
      deprecated: true
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            default: pt-BR
            enum: [en-US, pt-BR]
      requestBody:
        required: true
        content:
          "application/json; charset=UTF-8":
            schema:
              $ref: "#/components/schemas/Item"
      security:
        - ApiKeyHeader: []
          OAuth2: ["items:write"]
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags: [manual-matrix]
      operationId: replaceManualItem
      summary: URL-encoded form and scalar response
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FormItem"
            encoding:
              tags:
                style: pipeDelimited
                explode: false
                allowReserved: true
      security:
        - ApiKeyQuery: []
      responses:
        "202":
          description: Replacement job identifier
          content:
            text/plain:
              schema:
                type: string
    patch:
      tags: [manual-matrix]
      operationId: patchManualItem
      summary: Multipart form and binary file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                note:
                  type: string
                  maxLength: 120
                file:
                  description: Raw PDF part; its media type is defined by the Encoding Object.
            encoding:
              file:
                contentType: application/pdf
                headers:
                  X-Checksum:
                    schema:
                      type: string
      security:
        - ApiKeyCookie: []
      responses:
        "206":
          description: Binary patch receipt
          content:
            application/octet-stream:
              schema: {}
    delete:
      tags: [manual-matrix]
      operationId: deleteManualItem
      summary: Public operation with no response body
      security: []
      responses:
        "204":
          description: Deleted
    head:
      tags: [manual-matrix]
      operationId: headManualItem
      summary: Wildcard success response containing only headers
      security:
        - BearerAuth: []
      responses:
        "2XX":
          description: Item metadata
          headers:
            ETag:
              schema:
                type: string
            X-Item-Version:
              schema:
                type: integer
                format: int64
    options:
      tags: [manual-matrix]
      operationId: optionsManualItem
      summary: Default response fallback and unconstrained body
      security:
        - OpenId: [openid]
      responses:
        default:
          description: Supported capabilities
          content:
            application/json:
              schema: true
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      deprecated: true
      schema:
        type: string
        default: controlled-test
  headers:
    RateLimit:
      description: Remaining requests
      schema:
        type: integer
        format: int32
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      name: X-API-Key
      in: header
    ApiKeyQuery:
      type: apiKey
      name: api_key
      in: query
    ApiKeyCookie:
      type: apiKey
      name: session_key
      in: cookie
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.test/authorize
          tokenUrl: https://auth.example.test/token
          refreshUrl: https://auth.example.test/refresh
          scopes:
            items:write: Modify manual items
    OpenId:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.test/.well-known/openid-configuration
  schemas:
    BaseItem:
      type: object
      required: [name, status]
      discriminator:
        propertyName: kind
        mapping:
          standard: "#/components/schemas/Item"
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^[A-Za-z0-9 _-]+$'
        nickname:
          type: [string, "null"]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        price:
          type: number
          format: double
          minimum: 0
          maximum: 999999
          multipleOf: 0.01
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        birthday:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
          readOnly: true
    Item:
      allOf:
        - $ref: "#/components/schemas/BaseItem"
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [standard, special]
            tags:
              type: array
              minItems: 1
              maxItems: 10
              uniqueItems: true
              items:
                type: string
            metadata:
              type: object
              additionalProperties:
                type: string
            stringValues:
              type: array
              examples:
                - [alpha, beta]
              items:
                type: string
            longValues:
              type: array
              examples:
                - [1, 9223372036854775807]
              items:
                type: integer
                format: int64
            doubleValues:
              type: array
              examples:
                - [10.5, 99.99]
              items:
                type: number
                format: double
            objectValues:
              type: array
              examples:
                - - code: simple
                    active: true
              items:
                type: object
                required: [code, active]
                properties:
                  code:
                    type: string
                  active:
                    type: boolean
            nestedItems:
              type: array
              items:
                type: array
                items:
                  type: integer
            freeForm: {}
            secret:
              type: string
              format: password
              writeOnly: true
          oneOf:
            - properties:
                kind:
                  const: standard
            - properties:
                kind:
                  const: special
                priority:
                  type: integer
          anyOf:
            - required: [tags]
            - required: [metadata]
          not:
            required: [forbidden]
          if:
            properties:
              kind:
                const: special
          then:
            required: [priority]
          else:
            properties:
              priority:
                maximum: 0
          dependentSchemas:
            priority:
              properties:
                reviewed:
                  type: boolean
          dependentRequired:
            priority: [kind]
          discriminator:
            propertyName: kind
            mapping:
              standard: "#/components/schemas/Item"
    FormItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        tags:
          type: array
          items:
            type: string
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
