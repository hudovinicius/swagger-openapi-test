swagger: "2.0"
info:
  title: Manual import matrix - Swagger 2.0
  version: 2.0.0
  description: Same endpoint and methods used by every supported specification version.
host: manual.example.test
basePath: /api
schemes: [https]
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  ApiKeyHeader:
    type: apiKey
    name: X-API-Key
    in: header
  ApiKeyQuery:
    type: apiKey
    name: api_key
    in: query
  BasicAuth:
    type: basic
  OAuth2:
    type: oauth2
    flow: accessCode
    authorizationUrl: https://auth.example.test/authorize
    tokenUrl: https://auth.example.test/token
    scopes:
      items:write: Modify manual items
security:
  - ApiKeyHeader: []
paths:
  /manual/items/{id}:
    parameters:
      - name: id
        in: path
        description: Item identifier
        required: true
        type: string
        pattern: '^[a-z0-9-]+$'
      - name: locale
        in: query
        type: string
        default: en-US
        enum: [en-US, pt-BR]
      - name: X-Correlation-ID
        in: header
        required: true
        type: string
        default: controlled-test
    get:
      tags: [manual-matrix]
      operationId: getManualItem
      summary: Root array response, parameters, response header and security OR
      parameters:
        - name: labels
          in: query
          type: array
          collectionFormat: multi
          items:
            type: string
            enum: [manual, regression, smoke]
      security:
        - ApiKeyHeader: []
        - BasicAuth: []
      produces: [application/vnd.totvs.item+json]
      responses:
        "200":
          description: Matching items
          headers:
            X-Rate-Limit:
              description: Remaining requests
              type: integer
              format: int32
          schema:
            type: array
            items:
              $ref: "#/definitions/Item"
        "400":
          description: Invalid query
          schema:
            $ref: "#/definitions/Problem"
    post:
      tags: [manual-matrix]
      operationId: createManualItem
      summary: JSON object, parameter override and security AND
      consumes: ["application/json; charset=UTF-8"]
      parameters:
        - name: locale
          in: query
          type: string
          default: pt-BR
          enum: [en-US, pt-BR]
        - name: payload
          in: body
          required: true
          schema:
            $ref: "#/definitions/Item"
      security:
        - ApiKeyHeader: []
          OAuth2: ["items:write"]
      responses:
        "201":
          description: Created item
          schema:
            $ref: "#/definitions/Item"
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Problem"
    put:
      tags: [manual-matrix]
      operationId: replaceManualItem
      summary: URL-encoded form and scalar response
      consumes: [application/x-www-form-urlencoded]
      produces: [text/plain]
      parameters:
        - name: name
          in: formData
          required: true
          type: string
          minLength: 2
          maxLength: 80
        - name: status
          in: formData
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        - name: tags
          in: formData
          type: array
          collectionFormat: pipes
          items:
            type: string
      security:
        - ApiKeyQuery: []
      responses:
        "202":
          description: Replacement job identifier
          schema:
            type: string
    patch:
      tags: [manual-matrix]
      operationId: patchManualItem
      summary: Multipart form and binary file
      consumes: [multipart/form-data]
      produces: [application/octet-stream]
      parameters:
        - name: note
          in: formData
          type: string
          maxLength: 120
        - name: file
          in: formData
          required: true
          type: file
      responses:
        "206":
          description: Binary patch receipt
          schema:
            type: string
            format: binary
    delete:
      tags: [manual-matrix]
      operationId: deleteManualItem
      summary: Public operation with no response body
      security: []
      responses:
        "204":
          description: Deleted
    head:
      tags: [manual-matrix]
      operationId: headManualItem
      summary: Response containing only headers
      responses:
        "200":
          description: Item metadata
          headers:
            ETag:
              type: string
            X-Item-Version:
              type: integer
              format: int64
    options:
      tags: [manual-matrix]
      operationId: optionsManualItem
      summary: Default response fallback and free-form object
      responses:
        default:
          description: Supported capabilities
          schema:
            type: object
            additionalProperties:
              type: string
definitions:
  BaseItem:
    type: object
    required: [name, status]
    discriminator: kind
    properties:
      id:
        type: string
        readOnly: true
      name:
        type: string
        minLength: 2
        maxLength: 80
        pattern: '^[A-Za-z0-9 _-]+$'
      status:
        type: string
        enum: [ACTIVE, INACTIVE]
        default: ACTIVE
      price:
        type: number
        format: double
        minimum: 0
        maximum: 999999
      createdAt:
        type: string
        format: date-time
        readOnly: true
  Item:
    allOf:
      - $ref: "#/definitions/BaseItem"
      - type: object
        required: [kind]
        properties:
          kind:
            type: string
            enum: [standard, special]
          tags:
            type: array
            minItems: 1
            maxItems: 10
            uniqueItems: true
            items:
              type: string
          metadata:
            type: object
            additionalProperties:
              type: string
          nestedItems:
            type: array
            items:
              type: array
              items:
                type: integer
          secret:
            type: string
            writeOnly: true
  Problem:
    type: object
    required: [code, message]
    properties:
      code:
        type: string
      message:
        type: string
