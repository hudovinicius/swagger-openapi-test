swagger: "2.0"
info:
  title: Manual import matrix - Swagger 2.0
  version: 1.0.0
  description: Controlled fixture for the supported Swagger 2.0 family.
host: manual.example.test
basePath: /api
schemes: [https]
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    name: X-API-Key
    in: header
  BasicAuth:
    type: basic
security:
  - ApiKeyAuth: []
paths:
  /manual/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        type: string
        pattern: '^[a-z0-9-]+$'
    post:
      tags: [manual-swagger-2]
      operationId: createManualItem
      summary: Exercise JSON body and response mapping
      deprecated: true
      parameters:
        - name: verbose
          in: query
          type: boolean
          default: false
        - name: labels
          in: query
          type: array
          collectionFormat: multi
          items:
            type: string
        - name: X-Correlation-ID
          in: header
          required: true
          type: string
        - name: payload
          in: body
          required: true
          schema:
            $ref: "#/definitions/Item"
      security:
        - ApiKeyAuth: []
        - BasicAuth: []
      responses:
        "201":
          description: Created item
          headers:
            X-Rate-Limit:
              description: Remaining requests
              type: integer
              format: int32
          schema:
            $ref: "#/definitions/Item"
        "400":
          description: Invalid payload
          schema:
            $ref: "#/definitions/Problem"
        default:
          description: Unexpected error
    put:
      tags: [manual-swagger-2]
      operationId: uploadManualItem
      summary: Exercise multipart and binary formData mapping
      consumes: [multipart/form-data]
      parameters:
        - name: note
          in: formData
          type: string
          maxLength: 120
        - name: file
          in: formData
          required: true
          type: file
      responses:
        "204":
          description: Upload accepted
definitions:
  BaseItem:
    type: object
    required: [name, status]
    discriminator: kind
    properties:
      id:
        type: string
        readOnly: true
      name:
        type: string
        minLength: 2
        maxLength: 80
        pattern: '^[A-Za-z0-9 _-]+$'
      status:
        type: string
        enum: [ACTIVE, INACTIVE]
        default: ACTIVE
      price:
        type: number
        format: double
        minimum: 0
      createdAt:
        type: string
        format: date-time
        readOnly: true
  Item:
    allOf:
      - $ref: "#/definitions/BaseItem"
      - type: object
        properties:
          tags:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
          metadata:
            type: object
            additionalProperties:
              type: string
          secret:
            type: string
            writeOnly: true
  Problem:
    type: object
    required: [code, message]
    properties:
      code:
        type: string
      message:
        type: string

