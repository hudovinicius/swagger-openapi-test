swagger: '2.0'
info:
  title: Storefront Import Test API - Swagger 2.0
  description: |
    A fictional storefront API covering catalog browsing, product maintenance,
    binary images, order creation and operational health checks.
  termsOfService: https://storefront.example.test/terms
  contact:
    name: Storefront API Team
    email: api@example.test
    url: https://storefront.example.test/support
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
host: sandbox.storefront.example.test
basePath: /api/v1
schemes: [https]
consumes: [application/json]
produces: [application/json]
tags:
  - name: Products
    description: Product catalog and maintenance
  - name: Orders
    description: Customer order lifecycle
  - name: Operations
    description: Operational endpoints
externalDocs:
  description: Integration guide
  url: https://storefront.example.test/docs
security:
  - ApiKeyHeader: []
securityDefinitions:
  ApiKeyHeader:
    type: apiKey
    in: header
    name: X-API-Key
  ApiKeyQuery:
    type: apiKey
    in: query
    name: api_key
  BearerToken:
    type: apiKey
    in: header
    name: Authorization
  BasicAuth:
    type: basic
  OAuth2:
    type: oauth2
    flow: accessCode
    authorizationUrl: https://identity.example.test/oauth/authorize
    tokenUrl: https://identity.example.test/oauth/token
    scopes:
      products:read: Read the product catalog
      products:write: Maintain products
      orders:write: Create orders
paths:
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List catalog products
      description: Returns a paginated product collection with optional filters.
      parameters:
        - $ref: '#/parameters/CorrelationId'
        - $ref: '#/parameters/Page'
        - $ref: '#/parameters/PageSize'
        - name: sort
          in: query
          description: Ordered fields separated by pipes.
          type: array
          collectionFormat: pipes
          uniqueItems: true
          items:
            type: string
            enum: [name, -name, price, -price]
        - name: filter
          in: query
          description: JSON-encoded filter because Swagger 2.0 has no parameter content.
          type: string
      security:
        - ApiKeyHeader: []
        - OAuth2: ['products:read']
      responses:
        '200':
          $ref: '#/responses/ProductPageResponse'
        '304':
          description: Catalog has not changed
        default:
          $ref: '#/responses/ProblemResponse'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      parameters:
        - $ref: '#/parameters/IdempotencyKey'
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ProductInput'
      security:
        - OAuth2: ['products:write']
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URL of the created product
              type: string
          schema:
            $ref: '#/definitions/Product'
          examples:
            application/json:
              id: 9a25cfe8-83ee-4f5c-a5ad-fd49f122a1aa
              type: physical
              name: Mechanical Keyboard
              sku: KEY-001
              price: 499.90
              stock: 25
        '409':
          $ref: '#/responses/ProblemResponse'
  /products/{productId}:
    parameters:
      - $ref: '#/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product
      parameters:
        - name: X-Locale
          in: header
          description: Requested localization for product text
          type: string
          default: pt-BR
        - name: X-Storefront-Session
          in: header
          description: Header fallback because Swagger 2.0 has no cookie parameters.
          type: string
      security:
        - ApiKeyHeader: []
        - BearerToken: []
      produces: [application/json, application/xml]
      responses:
        '200':
          description: Product found
          headers:
            ETag:
              description: Current resource entity tag
              type: string
          schema:
            $ref: '#/definitions/Product'
        '404':
          $ref: '#/responses/ProblemResponse'
    put:
      tags: [Products]
      operationId: replaceProduct
      summary: Replace a product
      parameters:
        - name: If-Match
          in: header
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ProductInput'
      security:
        - OAuth2: ['products:write']
      responses:
        '200':
          description: Product replaced
          schema:
            $ref: '#/definitions/Product'
        '412':
          $ref: '#/responses/ProblemResponse'
    patch:
      tags: [Products]
      operationId: patchProduct
      summary: Partially update a product
      consumes: [application/merge-patch+json]
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ProductPatch'
      security:
        - OAuth2: ['products:write']
      responses:
        '200':
          description: Product updated
          schema:
            $ref: '#/definitions/Product'
        '422':
          $ref: '#/responses/ProblemResponse'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete a product
      security:
        - OAuth2: ['products:write']
          ApiKeyHeader: []
      responses:
        '204':
          description: Product deleted
        '404':
          $ref: '#/responses/ProblemResponse'
    head:
      tags: [Products]
      operationId: headProduct
      summary: Read product metadata
      security:
        - ApiKeyQuery: []
      responses:
        '200':
          description: Product metadata
          headers:
            ETag:
              description: Current resource entity tag
              type: string
            X-Product-Version:
              type: integer
              format: int64
    options:
      tags: [Products]
      operationId: productOptions
      summary: Discover product capabilities
      security: []
      responses:
        default:
          description: Supported methods and features
          schema:
            type: object
            additionalProperties: true
  /products/{productId}/image:
    parameters:
      - $ref: '#/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProductImage
      summary: Download the product image
      security:
        - ApiKeyHeader: []
      produces: [image/png, image/jpeg]
      responses:
        '200':
          description: Raw product image
          headers:
            Content-Disposition:
              type: string
          schema:
            type: string
            format: binary
        '404':
          $ref: '#/responses/ProblemResponse'
    put:
      tags: [Products]
      operationId: uploadProductImage
      summary: Upload the product image
      consumes: [multipart/form-data]
      parameters:
        - name: file
          in: formData
          required: true
          type: file
        - name: altText
          in: formData
          type: string
          maxLength: 120
        - name: X-Checksum-SHA256
          in: header
          type: string
          pattern: '^[a-f0-9]{64}$'
      security:
        - OAuth2: ['products:write']
      responses:
        '204':
          description: Image stored
        '413':
          $ref: '#/responses/ProblemResponse'
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/OrderInput'
      security:
        - ApiKeyHeader: []
          OAuth2: ['orders:write']
      responses:
        '202':
          description: Order accepted for processing
          headers:
            Retry-After:
              type: integer
              minimum: 1
          schema:
            $ref: '#/definitions/Order'
        '400':
          $ref: '#/responses/ProblemResponse'
  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      parameters:
        - name: orderId
          in: path
          required: true
          type: string
          format: uuid
      security:
        - BearerToken: []
        - BasicAuth: []
      responses:
        '200':
          description: Order found
          schema:
            $ref: '#/definitions/Order'
        '404':
          $ref: '#/responses/ProblemResponse'
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Read service health
      security: []
      produces: [text/plain, application/health+json]
      responses:
        '200':
          description: Service is healthy
          schema:
            type: string
            enum: [ok]
        '503':
          $ref: '#/responses/ProblemResponse'
  /data-types:
    post:
      tags: [Operations]
      operationId: echoDataTypes
      summary: Echo every supported schema data type
      description: Accepts and returns one example of every Swagger schema data type and common format.
      security: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AllDataTypes'
      responses:
        '200':
          description: Every submitted value echoed back
          schema:
            $ref: '#/definitions/AllDataTypes'
        '400':
          $ref: '#/responses/ProblemResponse'
parameters:
  CorrelationId:
    name: X-Correlation-ID
    in: header
    required: true
    description: End-to-end request correlation identifier
    type: string
    format: uuid
  Page:
    name: page
    in: query
    type: integer
    format: int32
    minimum: 1
    default: 1
  PageSize:
    name: pageSize
    in: query
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  ProductId:
    name: productId
    in: path
    required: true
    type: string
    format: uuid
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: true
    type: string
    minLength: 16
    maxLength: 64
responses:
  ProductPageResponse:
    description: Paginated products
    headers:
      X-Total-Count:
        description: Total matching products
        type: integer
        format: int64
      Link:
        description: RFC 8288 pagination links
        type: string
    schema:
      $ref: '#/definitions/ProductPage'
  ProblemResponse:
    description: Request could not be processed
    schema:
      $ref: '#/definitions/Problem'
definitions:
  AllDataTypes:
    type: object
    required:
      - stringValue
      - byteValue
      - binaryValue
      - dateValue
      - dateTimeValue
      - passwordValue
      - emailValue
      - uuidValue
      - uriValue
      - integerValue
      - int32Value
      - int64Value
      - numberValue
      - floatValue
      - doubleValue
      - booleanValue
      - arrayValue
      - integerArrayValue
      - numberArrayValue
      - booleanArrayValue
      - objectArrayValue
      - nestedArrayValue
      - objectValue
      - nullableValue
    properties:
      stringValue:
        type: string
        example: Storefront
      byteValue:
        type: string
        format: byte
        example: U3RvcmVmcm9udA==
      binaryValue:
        type: string
        format: binary
        example: raw-binary-content
      dateValue:
        type: string
        format: date
        example: '2026-08-05'
      dateTimeValue:
        type: string
        format: date-time
        example: '2026-08-05T12:30:00Z'
      passwordValue:
        type: string
        format: password
        example: secret-value
      emailValue:
        type: string
        format: email
        example: customer@example.test
      uuidValue:
        type: string
        format: uuid
        example: 9a25cfe8-83ee-4f5c-a5ad-fd49f122a1aa
      uriValue:
        type: string
        format: uri
        example: https://storefront.example.test/products/1
      integerValue:
        type: integer
        example: 10
      int32Value:
        type: integer
        format: int32
        example: 2147483647
      int64Value:
        type: integer
        format: int64
        example: 9007199254740991
      numberValue:
        type: number
        example: 10.25
      floatValue:
        type: number
        format: float
        example: 3.14
      doubleValue:
        type: number
        format: double
        example: 2.718281828
      booleanValue:
        type: boolean
        example: true
      arrayValue:
        type: array
        items:
          type: string
        example: [alpha, beta]
      integerArrayValue:
        type: array
        items:
          type: integer
          format: int32
        example: [1, 2, 3]
      numberArrayValue:
        type: array
        items:
          type: number
          format: double
        example: [1.5, 2.75, 10.25]
      booleanArrayValue:
        type: array
        items:
          type: boolean
        example: [true, false]
      objectArrayValue:
        type: array
        items:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        example:
          - id: 1
            name: first
          - id: 2
            name: second
      nestedArrayValue:
        type: array
        items:
          type: array
          items:
            type: integer
        example:
          - [1, 2]
          - [3, 4]
      objectValue:
        type: object
        additionalProperties:
          type: string
        example:
          environment: sandbox
      nullableValue:
        type: string
        x-nullable: true
  Money:
    type: number
    format: double
    minimum: 0
    maximum: 9999999.99
    multipleOf: 0.01
  ProductInput:
    type: object
    discriminator: type
    required: [type, name, sku, price]
    properties:
      type:
        type: string
        enum: [physical, digital]
      name:
        type: string
        minLength: 2
        maxLength: 120
        pattern: '^[^<>]+$'
      sku:
        type: string
        pattern: '^[A-Z0-9-]{3,32}$'
      description:
        type: string
        maxLength: 2000
      price:
        $ref: '#/definitions/Money'
      stock:
        type: integer
        format: int32
        minimum: 0
      weightGrams:
        type: integer
        minimum: 1
      downloadUrl:
        type: string
        format: uri
      checksum:
        type: string
        pattern: '^[a-f0-9]{64}$'
      tags:
        type: array
        uniqueItems: true
        maxItems: 20
        items:
          type: string
      attributes:
        type: object
        additionalProperties:
          type: string
      dimensions:
        type: array
        minItems: 3
        maxItems: 3
        items:
          type: number
      internalCost:
        $ref: '#/definitions/Money'
  Product:
    allOf:
      - $ref: '#/definitions/ProductInput'
      - type: object
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          createdAt:
            type: string
            format: date-time
            readOnly: true
          updatedAt:
            type: string
            format: date-time
            readOnly: true
  ProductPatch:
    type: object
    minProperties: 1
    properties:
      type:
        type: string
        enum: [physical, digital]
      name:
        type: string
        minLength: 2
      description:
        type: string
      price:
        $ref: '#/definitions/Money'
      stock:
        type: integer
        minimum: 0
  ProductPage:
    type: object
    required: [items, page, pageSize, total]
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/Product'
      page:
        type: integer
        minimum: 1
      pageSize:
        type: integer
        minimum: 1
      total:
        type: integer
        format: int64
        minimum: 0
  OrderLineInput:
    type: object
    required: [productId, quantity]
    properties:
      productId:
        type: string
        format: uuid
      quantity:
        type: integer
        minimum: 1
        maximum: 999
  OrderInput:
    type: object
    required: [customerEmail, lines]
    properties:
      customerEmail:
        type: string
        format: email
      lines:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/OrderLineInput'
      notes:
        type: string
      metadata:
        type: object
        additionalProperties: true
  Order:
    allOf:
      - $ref: '#/definitions/OrderInput'
      - type: object
        required: [total]
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          status:
            type: string
            enum: [pending, paid, shipped, cancelled]
            readOnly: true
          total:
            $ref: '#/definitions/Money'
          createdAt:
            type: string
            format: date-time
            readOnly: true
  Problem:
    type: object
    required: [type, title, status]
    properties:
      type:
        type: string
        format: uri
      title:
        type: string
      status:
        type: integer
        minimum: 400
        maximum: 599
      detail:
        type: string
      instance:
        type: string
      violations:
        type: array
        items:
          type: object
          required: [field, message]
          properties:
            field:
              type: string
            message:
              type: string
